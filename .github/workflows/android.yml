name: Android (NOVA Captura)

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      # Los runners de GitHub traen el SDK de Android (ANDROID_HOME), así que se incluye el módulo :app.
      - name: Pruebas de la lógica de captura
        run: gradle :core:test --no-daemon
      - name: Compilar APK
        run: gradle :app:assembleRelease :app:lintRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nova-captura-apk
          path: android/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-release.html
