name: CI (servidor y web)

on:
  push:
    paths-ignore: ['android/**', 'docs/**', '*.md']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: nova, POSTGRES_PASSWORD: nova, POSTGRES_DB: nova_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nova" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Pruebas del servidor (PostgreSQL real)
        run: npm test
      - name: Pruebas de interfaz (móvil y escritorio)
        run: npx playwright install --with-deps chromium && npm run test:e2e
        env:
          CHROMIUM_PATH: ''
